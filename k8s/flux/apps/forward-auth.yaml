apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forward-auth
  namespace: flux-system
spec:
  interval: 15m
  releaseName: forward-auth
  targetNamespace: identity
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  chart:
    spec:
      chart: ./k8s/charts/forward-auth
      interval: 15m
      reconcileStrategy: Revision
      sourceRef:
        { kind: GitRepository, name: flux-system, namespace: flux-system }
  valuesFrom:
    - { kind: ConfigMap, name: cute-haus-global, valuesKey: values.yaml }
  values:
    apps:
      navidrome: {}
