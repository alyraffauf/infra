apiVersion: apps/v1
kind: Deployment
metadata:
  name: watsup
  labels:
    app: watsup
spec:
  replicas: 2
  selector:
    matchLabels:
      app: watsup
  template:
    metadata:
      labels:
        app: watsup
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsPolicy: ClusterFirst
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: watsup
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: watsup
      containers:
        - name: watsup
          image: ghcr.io/alyraffauf/watsup:latest@sha256:f28824be43af70f7a163dfa8056b77fadd0fa59f95cad1d713e8cad35c529b18
          imagePullPolicy: IfNotPresent
          env:
            - name: WATSUP_CONFIG_PATH
              value: /run/configs/watsup.toml
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /run/configs/watsup.toml
              subPath: watsup.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: watsup-config
