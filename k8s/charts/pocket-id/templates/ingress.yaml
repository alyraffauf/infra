apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocket-id
  labels:
    app: pocket-id
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "id.cute.haus"
      secretName: cute-haus-tls
  rules:
    - host: "id.cute.haus"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocket-id
                port:
                  number: 80
