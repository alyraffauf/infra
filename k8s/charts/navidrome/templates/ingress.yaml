apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome
  labels:
    app: navidrome
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: identity-forward-auth-navidrome@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "navidrome.cute.haus"
      secretName: cute-haus-tls
  rules:
    - host: "navidrome.cute.haus"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: navidrome
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome-rest
  labels:
    app: navidrome
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-navidrome-drop-auth-header@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "navidrome.cute.haus"
      secretName: cute-haus-tls
  rules:
    - host: "navidrome.cute.haus"
      http:
        paths:
          - path: /rest/
            pathType: Prefix
            backend:
              service:
                name: navidrome
                port:
                  number: 80
