{{- range $name, $role := .Values.roles }}
{{- $db := $role.database | default $name }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $db }}
spec:
  name: {{ $db }}
  owner: {{ $name }}
  ensure: {{ $role.ensure | default "present" }}
  cluster:
    name: {{ $.Values.cluster.name }}
{{- end }}
