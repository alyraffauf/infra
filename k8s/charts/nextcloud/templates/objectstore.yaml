apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-objectstore
  labels:
    app: nextcloud
spec:
  capacity:
    storage: 3Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - jubilife
  hostPath:
    path: /mnt/Data/nextcloud/objectstore
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-objectstore
  labels:
    app: nextcloud
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: nextcloud-objectstore
  resources:
    requests:
      storage: 3Ti
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-objectstore
  labels:
    app: nextcloud
spec:
  selector:
    app: nextcloud-objectstore
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-objectstore
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud-objectstore
  template:
    metadata:
      labels:
        app: nextcloud-objectstore
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: jubilife
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-env
                  key: OBJECTSTORE_S3_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-env
                  key: OBJECTSTORE_S3_SECRET
          ports:
            - name: s3
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-objectstore
