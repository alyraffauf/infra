apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aly-codes
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app: aly-codes
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "aly.codes"
        - "www.aly.codes"
      secretName: aly-codes-tls
  rules:
    - host: "aly.codes"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aly-codes
                port:
                  number: 80
    - host: "www.aly.codes"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aly-codes
                port:
                  number: 80
