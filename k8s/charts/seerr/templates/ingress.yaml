apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
  labels:
    app: seerr
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "seerr.cute.haus"
      secretName: cute-haus-tls
  rules:
    - host: "seerr.cute.haus"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seerr
                port:
                  number: 80
