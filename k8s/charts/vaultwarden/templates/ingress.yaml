apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "vault.cute.haus"
      secretName: cute-haus-tls
  rules:
    - host: "vault.cute.haus"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
