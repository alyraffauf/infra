concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build-jubilife:
    runs-on: ubuntu-latest
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
    - name: Cachix
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: cutehaus
    - name: Build jubilife
      run: nix build --accept-flake-config --print-out-paths .#nixosConfigurations.jubilife.config.system.build.toplevel
  build-pastoria:
    runs-on: ubuntu-latest
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
    - name: Cachix
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: cutehaus
    - name: Build pastoria
      run: nix build --accept-flake-config --print-out-paths .#nixosConfigurations.pastoria.config.system.build.toplevel
  build-snowpoint:
    runs-on: ubuntu-latest
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
    - name: Cachix
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: cutehaus
    - name: Build snowpoint
      run: nix build --accept-flake-config --print-out-paths .#nixosConfigurations.snowpoint.config.system.build.toplevel
name: build-nixos
'on':
  pull_request:
    paths-ignore:
      - k8s/**
  push:
    branches:
    - master
    paths-ignore:
    - k8s/**
    - '**/*.md'
    - .github/**
    - _img/**
  workflow_dispatch: {}
